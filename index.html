<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KANAL · Breite (B)</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:40px;}
pre{background:#111;border-left:3px solid #6cf;padding:12px;}
button{background:#111;color:#0f0;border:1px solid #333;padding:8px 16px;}
</style>
</head>
<body>

<h1>KANAL · Breite (B)</h1>

<button onclick="run()">LOAD SYS</button>
<pre id="out">Bereit…</pre>

<script type="module">
import sysIn from "./sys.in.json" assert {type:"json"};
import sysOut from "./sys.out.json" assert {type:"json"};
import sysScale from "./sys.scale.json" assert {type:"json"};
import sysHdf from "./sys.hdf.json" assert {type:"json"};

function run(){
    const data = {sysIn, sysOut, sysScale, sysHdf};
    out.textContent = JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
